name: Bug Report
description: Report any bugs here.
labels: [bug]
body:
- type: input
  attributes:
    label: Version
    placeholder: A branch, commit hash, or specific number such as "1.2.3".
  validations:
    required: true
- type: textarea
  attributes:
    label: Environment
    placeholder: The location the bug was discovered in.
  validations:
    required: true
- type: textarea
  attributes:
    label: Describe the Bug
    description: |
      A clear description of what the bug is. Feel free to add pictures.
      Explain how to trigger the bug.
    placeholder: |
      When X and Y are called in this order, Z error appears.
      Here is a code snippet that shows a minimal reproduction of the bug.
  validations:
    required: true
