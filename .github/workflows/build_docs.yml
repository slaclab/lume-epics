
name: Build Docs

on:
  push:
    branches:
      - main
      - github-actions
jobs:
  build:
    if: ${{ github.repository == 'slaclab/lume-epics' }}
    runs-on: ubuntu-latest
    name:  Build Docs
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Build Docs
        run: |
          python -m pip install -e ".[docs]"
          mkdocs build
          mkdocs gh-deploy --force
